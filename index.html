<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: flex;
        }

        input{
            margin-right: 5px;
        }
    </style>
    <script>
        const URL = "https://6adea6e04e88f1bba4a53a55.mockapi.io/Student";

        async function loadStudents(){
            const response = await fetch(URL);

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }

            const students = await response.json();
            renderStudents(students);
        }

        function renderStudents(students){
            const list = document.querySelector("#studentList");
            list.replaceChildren();

            students.forEach(student => {
                const li = document.createElement("li");
                li.textContent = `${student.name} (${student.age})`;
                list.appendChild(li);

                const btn1 = document.createElement("button");
                btn1.innerText = "Update";
                li.appendChild(btn1);

                const btn2 = document.createElement("button");
                btn2.innerText = "Delete";
                li.appendChild(btn2);
            });
        }

        async function addStudent(student){
            const response = await fetch(URL, {
                method:"POST",
                headers:{
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify(student)
            });

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`)
            }

            await loadStudents();
        }

        async function updateStudent(id, updatedData){
            const response = await fetch(`${URL}/${id}`, {
                method:"PATCH",
                headers:{
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify(updatedData)
            });

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`)
            }

            await loadStudents();
        }

        async function deleteStudent(id){
            const response = await fetch(`${URL}/${id}`,{
                method:"DELETE"
            });

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`)
            }

            await loadStudents();
        }   

        window.addEventListener("load",function(){
            const btn = document.querySelector("#btn");
            btn.addEventListener("click", loadStudents);
        })
    </script>
</head>
<body>
    <div>
    <input type="text" placeholder="name" id="name">
    <input type="text" placeholder="age" id="age">
    <input type="text" placeholder="major" id="major">
    <button id="addBtn">ADD</button>
    </div>

    <ul id="studentList">
        
    </ul>

    <button id="btn">Load</button>
</body>
</html>
