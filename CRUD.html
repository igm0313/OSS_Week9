<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>

    <style>
        #appSchedule{margin-left: 30px;}
        .editButton{
            margin-left: 20px;
        }
        #scheduleList{
            margin-top: 20px;
        }

        h1{
            font-size: 50px;
            text-align: center;
        }

    </style>

    <script>
        const URL = "https://6adea6e04e88f1bba4a53a55.mockapi.io/Todo";

        let todo = {
            title: "",
            category: "",
            due_day: "",
            priority: "",
            type: "",
            id: ""
        };


        async function loadTodos(){
            const response = await fetch(URL);

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }

            const Todos = await response.json();
            renderTodos(Todos);
        }

        function renderTodos(Todos){
            const list = document.querySelector("#TodoList");
            list.replaceChildren();

            Todos.forEach(Todo => {
                const li = document.createElement("li");
                li.textContent = `${Todo.title} (${Todo.category}) ${Todo.due_day}까지. 우선 순위: ${Todo.priority} / 상태: ${Todo.type}`;
                li.dataset.id = Todo.id;
                list.appendChild(li);

                const btn1 = document.createElement("button");
                btn1.innerText = "Update";
                li.appendChild(btn1);
                btn1.classList.add("btn");
                btn1.classList.add("btn-primary");
                btn1.addEventListener("click", ()=> callUpdateBtn(Todo));

                const btn2 = document.createElement("button");
                btn2.innerText = "Delete";
                li.appendChild(btn2);
                btn2.classList.add("btn");
                btn2.classList.add("btn-danger");
                btn2.addEventListener("click", callDelete);
            });
        }

        async function addTodo(Todo){
            const response = await fetch(URL, {
                method:"POST",
                headers:{
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify(Todo)
            });

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`)
            }

            await loadTodos();
        }

        async function updateTodo(id, updatedData){
            const response = await fetch(`${URL}/${id}`, {
                method:"PUT",
                headers:{
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify(updatedData)
            });

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`)
            }

            const btn = document.querySelector("#updateButton");
            btn.hidden = true;

            await loadTodos();
        }

        async function deleteTodo(id){
            const response = await fetch(`${URL}/${id}`,{
                method:"DELETE"
            });

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`)
            }

            await loadTodos();
        }   

        function callAdd(){
            event.preventDefault();

            const title = document.querySelector("#title");
            const category = document.querySelector("#category");
            const due_day = document.querySelector("#due_day");
            const priority = document.querySelector("#priority");
            const type = document.querySelector("#type");

            if(title.value == ""){
                alert("제목을 입력하세요.");
                title.focus();
                return;
            }

            if(!category.checkValidity()){
                alert("유형을 선택하세요.");
                category.focus();
                return;
            }

            if(!due_day.checkValidity()){
                alert("날짜를 입력하세요.");
                due_day.focus();
                return;
            }

            if(!priority.checkValidity()){
                alert("우선 순위를 선택하세요.");
                priority.focus();
                return;
            }

            if(!type.checkValidity()){
                alert("상태를 선택하세요.");
                type.focus();
                return;
            }

            todo.title = title.value;
            todo.category = category.value;
            todo.due_day = due_day.value;
            todo.priority = priority.value;
            todo.type = type.value;

            addTodo(todo);
        }

        function callDelete(){
            event.preventDefault();

            if(!confirm("삭제하시겠습니까?")) return;

            const li = event.target.parentElement;

            const id = li.dataset.id;
            
            deleteTodo(id);
        }

        function callUpdateBtn(Todo){
            event.preventDefault();

            const btn = document.querySelector("#updateButton");
            btn.hidden = false;

            const title = document.querySelector("#title");
            const category = document.querySelector("#category");
            const due_day = document.querySelector("#due_day");
            const priority = document.querySelector("#priority");
            const type = document.querySelector("#type");

            title.value = Todo.title;
            category.value = Todo.category;
            due_day.value = Todo.due_day;
            priority.value = Todo.priority;
            type.value = Todo.type;

            const li = event.target.parentElement;

            const id = li.dataset.id;

            btn.addEventListener("click", ()=>callUpdate(id))
        }

        function callUpdate(id){
            event.preventDefault();

            const title = document.querySelector("#title");
            const category = document.querySelector("#category");
            const due_day = document.querySelector("#due_day");
            const priority = document.querySelector("#priority");
            const type = document.querySelector("#type");

            if(title.value == ""){
                alert("제목을 입력하세요.");
                title.focus();
                return;
            }

            if(!category.checkValidity()){
                alert("유형을 선택하세요.");
                category.focus();
                return;
            }

            if(!due_day.checkValidity()){
                alert("날짜를 입력하세요.");
                due_day.focus();
                return;
            }

            if(!priority.checkValidity()){
                alert("우선 순위를 선택하세요.");
                priority.focus();
                return;
            }

            if(!type.checkValidity()){
                alert("상태를 선택하세요.");
                type.focus();
                return;
            }

            todo.title = title.value;
            todo.category = category.value;
            todo.due_day = due_day.value;
            todo.priority = priority.value;
            todo.type = type.value;

            updateTodo(id,todo);
        }

        async function filtering(){
            event.preventDefault();

            const response = await fetch(URL);

            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }

            const Todos = await response.json();

            const category = document.querySelector("#categorySearch");
            const todoFilter = Todos.filter(Todo => Todo.category === category.value)

            renderTodos(todoFilter);
        }

        window.addEventListener("load",function(){
            const btn = document.querySelector("#btn");
            btn.addEventListener("click", loadTodos);

            const addBtn = document.querySelector("#addSchedule");
            addBtn.addEventListener("click",callAdd);

            const searchBtn = document.querySelector("#searchBtn");
            searchBtn.addEventListener("click", filtering);
        })
    </script>
</head>

<body>
    <h1>To Do List</h1>

    <form id="scheduleForm" class="d-flex">
        <input type="text" id="title" placeholder="일정의 이름을 입력하세요." name="title" minlength="2" required>

        <select name="category" id="category" required>
            <option value="" hidden selected>선택</option>
            <option value="공부">공부</option>
            <option value="운동">운동</option>
            <option value="개인">개인</option>
        </select>

        <input type="date" id="due_day" name="due_day" min="2026-10-04" required>

        <select name="priority" id="priority" required>
            <option value="" hidden selected>선택</option>
            <option value="높음">높음</option>
            <option value="중간">중간</option>
            <option value="낮음">낮음</option>
        </select>

        <select name="type" id="type" required>
            <option value="" hidden selected>선택</option>
            <option value="진행 전">진행 전</option>
            <option value="진행 중">진행 중</option>
            <option value="완료">완료</option>
        </select>

        <button id="addSchedule" class="btn btn-primary">일정 추가</button>
        <button id="updateButton" class="btn btn-secondary" hidden>수정 완료</button>
    </form>

    <form class="d-flex">
        <select name="categorySearch" id="categorySearch" required>
            <option value="" hidden selected>선택</option>
            <option value="공부">공부</option>
            <option value="운동">운동</option>
            <option value="개인">개인</option>
        </select>
        <button id="searchBtn" class="btn btn-primary">검색</button>
    </form>

    <button id="btn" class="btn btn-primary ms-auto">불러오기</button>

    <ul id="TodoList">
    </ul>
</body>

</html>
